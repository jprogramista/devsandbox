# =============================================================================
# DEV SANDBOX - Docker Compose Configuration
# =============================================================================
# Activation:
#   docker-compose up -d
#
# Connection IntelliJ Gateway:
#   SSH: localhost:2222, user: developer, pass: sandbox
#
# Ports:
#   2222  - SSH (IntelliJ Gateway)
#   8080  - Spring Boot
#   5005  - Java Debug
#   4200  - Angular
#   9229  - Node Debug
# =============================================================================

services:
  # ===========================================================================
  # SANDBOX - Main development environment
  # ===========================================================================
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 20
        GRADLE_VERSION: "8.5"
        MAVEN_VERSION: "3.9.6"
        USERNAME: developer
        USER_UID: 1100
        USER_GID: 1100
    container_name: dev-sandbox
    hostname: dev-sandbox
    
    # Restart policy
    restart: unless-stopped
    
    # Ports
    ports:
      - "2222:22"      # SSH for IntelliJ Gateway
      - "8080:8080"    # Spring Boot
      - "5005:5005"    # Java Remote Debug
      - "4200:4200"    # Angular Dev Server
      - "9229:9229"    # Node.js Debug
#      - "3000:3000"    # Additional port (e.g. other services)
#      - "5000:5000"    # Python Flask/FastAPI
    
    # Volumes
    volumes:
      # Workspace - The ONLY volume with project data
      # You can replace it with a named volume for greater isolation
      - sandbox-workspace:/workspace
      
      # Cache persistence (optional - speeds up rebuilds)
      - sandbox-gradle-cache:/home/developer/.gradle
      - sandbox-maven-cache:/home/developer/.m2
      - sandbox-npm-cache:/home/developer/.npm
      - sandbox-sdkman-cache:/home/developer/.sdkman
      - sandbox-nvm-cache:/home/developer/.nvm
      
      # SSH keys (optional - for git clone via SSH)
      # Uncomment if you want to use SSH keys from the host
      # - ~/.ssh/id_ed25519:/home/developer/.ssh/id_ed25519:ro
      # - ~/.ssh/known_hosts:/home/developer/.ssh/known_hosts:ro
    
    # Network
    networks:
      - dev-network
    
    # Environment
    environment:
      # Timezone
      - TZ=Europe/Warsaw
      
      # Java
      - JAVA_OPTS=-Xmx2g -Xms512m
      
      # Spring Boot - connection to databases
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/devdb?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=dev
      - SPRING_DATASOURCE_PASSWORD=dev123
      
      # PostgreSQL alternative
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=devdb
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev123
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # Elasticsearch
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      
      # Node
      - NODE_ENV=development
      
      # Angular - allow connections from host
      - NG_CLI_ANALYTICS=false
    
    # Dependencies
#    depends_on:
#      mysql:
#        condition: service_healthy
#      postgres:
#        condition: service_healthy
#      redis:
#        condition: service_healthy
    
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

