# =============================================================================
# NETWORKS
# =============================================================================
networks:
  dev-network:
    driver: bridge
    # Isolation - no internet access for sandbox (optional)
    # internal: true

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  # Workspace - main volume with code
  sandbox-workspace:
    driver: local
  
  # Cache volumes - speeds up builds
  sandbox-gradle-cache:
    driver: local
  sandbox-maven-cache:
    driver: local
  sandbox-npm-cache:
    driver: local
  sandbox-sdkman-cache:
    driver: local
  sandbox-nvm-cache:
    driver: local
  
